services:
  - type: web
    name: payment-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/api/dist/server.js
    plan: starter
    healthCheckPath: /health/ready
    preDeployCommand: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: PAYMENT_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: RATE_LIMIT_WINDOW
        value: 1 minute
  - type: worker
    name: payment-platform-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/api/dist/worker.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: PAYMENT_TOKEN_ENCRYPTION_KEY
        sync: false
  - type: static_site
    name: payment-platform-web
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_REQUIRE_LOGIN
        value: "true"
